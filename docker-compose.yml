services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xtra
      POSTGRES_PASSWORD: xtra
      POSTGRES_DB: xtra_sign
      # Containers run UTC. A signature time that is silently offset is not a
      # defensible record.
      TZ: UTC
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xtra -d xtra_sign']
      interval: 5s
      retries: 10

  # Private object storage for local dev. Never configured public-read; the app
  # mints short-lived signed URLs instead of exposing a bucket.
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: xtra
      MINIO_ROOT_PASSWORD: xtra-dev-secret
      TZ: UTC
    ports: ['9100:9000', '9101:9001']
    volumes: [minio:/data]

  # Document conversion. Untrusted bytes meet a large third-party binary here,
  # so this is the most heavily constrained service in the stack.
  #
  # Runs locally exactly as it will in ECS — same image, same HTTP contract, same
  # limits. A dev-only shortcut would be the one path never exercised until it
  # matters.
  converter:
    build: ./docker/converter
    # Published locally so the dev server can reach it. In ECS there is no
    # published port: only the web service's security group may connect.
    ports: ['8090:8080']
    environment:
      TZ: UTC
      CONVERSION_TIMEOUT_MS: '60000'
      RENDER_TIMEOUT_MS: '30000'
      MAX_PAGES: '50'
      RENDER_WIDTH_PX: '1240'
      SCRATCH_DIR: /scratch
      HOME: /scratch
      MAX_CONCURRENT_CONVERSIONS: '2'
      MAX_UPLOAD_BYTES: '26214400'

    # An internal network only. The service must be reachable by the web app and
    # by nothing else — it has no reason to make an outbound connection, and a
    # document that tries to fetch a remote entity or template cannot. In ECS
    # this is a security group that allows exactly one inbound source.
    networks: [converter]

    # Nothing may write to the image. All scratch space is an explicit tmpfs
    # that vanishes with the container, so a failed run cannot leave residue on
    # a real filesystem.
    read_only: true
    tmpfs:
      - /scratch:rw,noexec,nosuid,size=512m
      - /tmp:rw,noexec,nosuid,size=64m

    # A conversion cannot escalate, cannot gain a capability it did not start
    # with, and cannot fork without bound.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          # A decompression bomb hits this ceiling and the process is killed,
          # rather than the host swapping until something else dies.
          memory: 1g
          cpus: '1.0'
          # A fork bomb in a malformed document cannot exhaust host PIDs.
          pids: 128

    restart: unless-stopped

    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  converter:

volumes:
  pgdata:
  minio:
